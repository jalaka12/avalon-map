<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>阿瓦隆全图 · 守图人</title>
<style>
/* ══════════════════════════════════════════════════
   「守图人的制图桌」 v4
   烛金=当前/可交互 · 苔绿=已探索 · 冥灰=未探索
   巨神柱残焰驱动全局主题：金(安) → 锈(警) → 血(危)
   控件与图例：暗色磨砂玻璃 + 汉字
   ══════════════════════════════════════════════════ */
:root{
    --bg:#0b0806;
    --desk:#17110a;
    --line:#2c251e;
    --line2:rgba(69,58,44,.65);
    --ink:#8a7d6d;
    --ink2:#c4b5a0;
    --ink3:#e8dcc8;
    --moss:#5e7a4f;
    --moss2:#7fa065;
    --glass:rgba(24,19,14,.55);
    --glass-hi:rgba(38,30,20,.65);
    /* 主题变量：由巨神柱残焰状态切换 */
    --accent:#daa520;
    --accent2:#e8c36a;
    --aglow:rgba(218,165,32,.45);
    --vig:rgba(218,165,32,0);
}
#shell.th-warn{
    --accent:#c07a3a;
    --accent2:#dda05a;
    --aglow:rgba(192,122,58,.5);
    --vig:rgba(160,100,40,.12);
}
#shell.th-danger{
    --accent:#c04040;
    --accent2:#e06060;
    --aglow:rgba(208,80,80,.55);
    --vig:rgba(150,30,30,.22);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100vh;height:100dvh;overflow:hidden}
body{
    background-color:var(--bg);
    background-repeat:no-repeat;background-position:center;background-attachment:fixed;background-size:cover;
    color:var(--ink);
    font-family:Georgia,'Times New Roman','宋体',serif;
    font-size:13px;
    user-select:none;-webkit-user-select:none;
}
body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.06) 3px,rgba(0,0,0,.06) 4px);
}

/* ── 骨架 ─────────────────────────────────────── */
.map-shell{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;padding:10px 12px;gap:6px}
.map-shell.fs{position:fixed;inset:0;z-index:9999;background:transparent;padding:14px 18px}

/* ── 标题带 ───────────────────────────────────── */
.head-band{
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;flex-shrink:0;
    padding:2px 4px 7px;
    border-bottom:1px solid transparent;
    border-image:linear-gradient(90deg,transparent,var(--line2) 20%,var(--line2) 80%,transparent) 1;
}
.map-title{
    font-size:19px;font-weight:700;letter-spacing:4px;
    background:linear-gradient(135deg,var(--accent2),var(--accent) 60%,#8a6510);
    -webkit-background-clip:text;background-clip:text;color:transparent;
}
.map-title::before{content:'❖';font-size:13px;margin-right:6px;-webkit-text-fill-color:var(--accent)}
.head-band .spring{margin-left:auto}

/* 巨神柱残焰 */
.pillar{display:flex;align-items:center;gap:4px;padding:5px 11px;border:1px solid var(--line2);border-radius:4px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pillar .p-label{font-size:11px;color:var(--ink2);letter-spacing:2px;margin-right:3px}
.pillar .p-days{font-size:14px;font-weight:700;color:var(--ink3);margin-left:5px;font-variant-numeric:tabular-nums}
.flame{width:9px;height:14px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:#2c241b;border:1px solid #453a2c;flex-shrink:0;transition:background .6s,border-color .6s,box-shadow .6s}
.flame.lit{background:linear-gradient(180deg,var(--accent2),var(--accent) 55%,#6a4a10);border-color:var(--accent);box-shadow:0 0 8px var(--aglow);animation:flicker 1.8s ease-in-out infinite}
#shell.th-danger .flame.lit{animation-duration:.8s}
@keyframes flicker{0%,100%{transform:scaleY(1) skewX(0)}30%{transform:scaleY(1.1) skewX(-2deg)}60%{transform:scaleY(.92) skewX(2deg)}}

/* ── 控制带 ───────────────────────────────────── */
.ctrl-band{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0;padding:2px 2px}
.loc-info{font-size:12px;color:var(--ink);white-space:nowrap;margin-right:auto}
.loc-info b{font-size:16px;color:var(--accent2);font-weight:700;letter-spacing:2px;margin-right:6px;transition:color .6s}
.grp{display:flex;gap:5px;align-items:center}
.grp + .grp{margin-left:4px;padding-left:10px;border-left:1px solid var(--line)}

/* 暗色磨砂玻璃按钮 + 汉字 */
.btn{
    min-height:36px;padding:7px 13px;
    background:var(--glass);color:var(--ink2);
    border:1px solid var(--line2);border-radius:4px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    font-family:inherit;font-size:12px;letter-spacing:2px;
    cursor:pointer;white-space:nowrap;
    transition:color .25s,border-color .25s,box-shadow .25s,transform .12s,background .25s;
}
.btn:hover{color:var(--ink3);background:var(--glass-hi);box-shadow:0 2px 10px rgba(0,0,0,.45)}
.btn:active{transform:scale(.93)}
.btn.on{
    color:var(--accent2);border-color:var(--accent);
    background:linear-gradient(180deg,rgba(48,38,20,.7),rgba(30,23,14,.7));
    box-shadow:inset 0 0 12px rgba(218,165,32,.12),0 0 10px var(--aglow);
}
.btn:disabled{opacity:.3;pointer-events:none}

/* ── 地图区 ───────────────────────────────────── */
.content{
    flex:1;position:relative;min-height:0;overflow:hidden;
    background:rgba(11,8,6,.38);   /* 半透明：无地图处透出页面底图 */
    border:1px solid var(--line2);
    box-shadow:inset 0 0 60px rgba(0,0,0,.35);
}
.content::after{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:5;
    box-shadow:inset 0 0 120px 30px var(--vig);
    transition:box-shadow .8s ease;
}
#shell.th-danger .content::after{animation:vigPulse 2.4s ease-in-out infinite}
@keyframes vigPulse{0%,100%{opacity:.7}50%{opacity:1}}

/* 8×10 全图视口 */
.big-view{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none}
.big-view.drag{cursor:grabbing}
.stage{position:absolute;top:0;left:0;width:1800px;height:2136px;transform-origin:0 0;will-change:transform}
.stage img.base{position:absolute;user-select:none;-webkit-user-drag:none;pointer-events:none}
/* 手绘整图铺核心区（西2~东3 × 北4~南1）：地图模式底图 */
.base-sketch{left:30%;top:12.5%;width:60%;height:75%}
/* 鸟瞰模式：8×10 原图拼接垫底，未探索格磨砂遮蔽 */
.base-aerial{inset:0;width:100%;height:100%}
.cell .frost{position:absolute;inset:0;background:rgba(13,10,7,.4);backdrop-filter:blur(7px) grayscale(.55) brightness(.7);-webkit-backdrop-filter:blur(7px) grayscale(.55) brightness(.7);pointer-events:none;box-shadow:inset 0 0 0 1px rgba(69,58,44,.35)}
/* 街景模式：当前地点大图 */
.street-view{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;cursor:zoom-in}
/* 图瓦坦：五牌并列（已解锁去磨砂，180/185 常驻牌追加） */
.tuv-row{display:none;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:12px;overflow:auto;max-width:96%}
.tuv-slot{position:relative;width:min(16%,150px);min-width:86px;aspect-ratio:922/1365;border:2px solid #241e17;border-radius:3px;overflow:hidden;background:#100d0a;transition:border-color .3s,box-shadow .3s;cursor:default}
.tuv-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;pointer-events:none}
.tuv-slot .frost{position:absolute;inset:0;background:rgba(13,10,7,.45);backdrop-filter:blur(7px) grayscale(.55) brightness(.7);-webkit-backdrop-filter:blur(7px) grayscale(.55) brightness(.7);box-shadow:inset 0 0 0 1px rgba(69,58,44,.35);pointer-events:none}
.tuv-slot.rev{cursor:pointer;border-color:var(--moss)}
.tuv-slot.rev:hover{border-color:var(--moss2);box-shadow:0 0 16px rgba(94,122,79,.4)}
.tuv-slot.cur{border-color:var(--accent);box-shadow:0 0 24px var(--aglow)}
.tuv-slot .slot-tag{position:absolute;left:0;right:0;bottom:0;padding:3px 2px;font-size:10px;letter-spacing:1px;text-align:center;background:rgba(10,8,6,.88);color:var(--ink2);pointer-events:none}
.tuv-slot.cur .slot-tag{color:var(--accent2)}
.street-view img{max-width:88%;max-height:82%;object-fit:contain;border:1px solid var(--line2);outline:1px solid #161210;outline-offset:5px;box-shadow:0 12px 50px rgba(0,0,0,.75);user-select:none;-webkit-user-drag:none;pointer-events:none}
.street-view .sv-cap{padding:6px 20px;font-size:13px;letter-spacing:2px;color:var(--ink2);border:1px solid var(--line2);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:4px;pointer-events:none}
.street-view .sv-cap b{color:var(--accent2);font-weight:700}

.cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(8,1fr)}
.cell{position:relative;overflow:hidden}
.cell img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;pointer-events:none}
.cell.explored{cursor:pointer}
.cell.explored:hover::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 30px var(--aglow);pointer-events:none;z-index:2}
/* 地图模式：未探索半遮蔽保质感，已探索苔痕 */
.cell .veil{position:absolute;inset:0;background:rgba(13,10,7,.5);pointer-events:none}
.cell .moss-mark{position:absolute;inset:0;background:rgba(94,122,79,.16);border:1px solid rgba(94,122,79,.4);pointer-events:none}

/* 图瓦坦牌组指示 */
.cell .tuv-deck{position:absolute;left:3px;right:3px;bottom:3px;display:flex;gap:3px;justify-content:center;z-index:2;pointer-events:none}
.tuv-card{flex:1;max-width:18px;height:22px;border:1px solid #453a2c;background:rgba(13,10,7,.85);color:#5a5045;font-size:10px;line-height:22px;text-align:center;border-radius:2px;transition:all .4s}
.tuv-card.on{border-color:var(--accent);color:var(--accent2);box-shadow:0 0 6px var(--aglow)}

/* 当前位置高亮 */
.hl{position:absolute;inset:0;z-index:3;pointer-events:none;border:2px solid var(--accent);box-shadow:inset 0 0 24px var(--aglow),0 0 24px var(--aglow);animation:breathe 2.6s ease-in-out infinite;transition:border-color .6s,box-shadow .6s}
.hl .dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,var(--accent2),var(--accent) 60%);box-shadow:0 0 16px var(--accent),0 0 34px var(--aglow)}
@keyframes breathe{0%,100%{opacity:.62}50%{opacity:1}}


/* ── 悬浮图例面板（可拖动磨砂玻璃） ───────────── */
.legend-panel{
    position:absolute;left:14px;bottom:14px;z-index:7;
    background:var(--glass);border:1px solid var(--line2);border-radius:6px;
    backdrop-filter:blur(10px) saturate(1.15);-webkit-backdrop-filter:blur(10px) saturate(1.15);
    box-shadow:0 6px 22px rgba(0,0,0,.55),inset 0 1px 0 rgba(232,220,200,.06);
    padding:9px 13px;font-size:12px;letter-spacing:1.5px;color:var(--ink2);
    cursor:grab;touch-action:none;
}
.legend-panel.dragging{cursor:grabbing;box-shadow:0 10px 30px rgba(0,0,0,.7)}
.lg-row{display:flex;align-items:center;gap:7px;padding:2px 0;white-space:nowrap}
.lg-cur{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--aglow);flex-shrink:0;transition:background .6s}
.lg-exp{width:9px;height:9px;background:var(--moss);transform:rotate(45deg);flex-shrink:0}
.lg-un{width:8px;height:8px;border:1px solid var(--ink);flex-shrink:0}
.lg-sep{height:1px;background:var(--line2);margin:6px 0}
.lg-stat{color:var(--ink3);font-variant-numeric:tabular-nums;font-weight:600}
.lg-grip{margin-top:5px;text-align:center;font-size:9px;color:#5a5045;letter-spacing:3px}

/* ── 底栏：操作提示 ───────────────────────────── */
.bottom-bar{
    flex-shrink:0;display:flex;align-items:center;justify-content:center;
    padding:6px 8px 2px;font-size:11px;letter-spacing:1.5px;color:#6b6055;
    border-top:1px solid transparent;
    border-image:linear-gradient(90deg,transparent,var(--line2) 20%,var(--line2) 80%,transparent) 1;
}

/* ── 灯箱（原图 + 缩放拖拽；全岛带迷雾磨砂遮罩） ── */
.lb{display:none;position:fixed;inset:0;z-index:10000;background:rgba(5,3,2,.95);cursor:grab;animation:fadeIn .25s ease}
.lb.on{display:flex;align-items:center;justify-content:center}
.lb.dragging{cursor:grabbing}
.lb-stage{position:relative;transform-origin:0 0;will-change:transform}
.lb-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;border:1px solid var(--line2);outline:1px solid #161210;outline-offset:5px;box-shadow:0 0 60px rgba(0,0,0,.85);user-select:none;-webkit-user-drag:none}
.lb .lb-x{position:absolute;top:16px;right:20px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:20px;border:1px solid var(--line2);border-radius:4px;cursor:pointer;z-index:2;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .25s}
.lb .lb-x:hover{color:var(--accent2);border-color:var(--accent)}
.lb .lb-cap{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);padding:7px 22px;font-size:13px;letter-spacing:2px;color:var(--ink2);border:1px solid var(--line2);background:rgba(18,14,10,.92);border-radius:4px;white-space:nowrap;z-index:2}
.lb .lb-cap b{color:var(--accent2);font-weight:700}
.lb .lb-hint{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:2px;color:#5a5045;z-index:2;white-space:nowrap}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ── 响应式 ───────────────────────────────────── */
@media (max-width:600px){
    .map-title{font-size:16px;letter-spacing:2px}
    .loc-info b{font-size:14px}
    .btn{min-height:38px;padding:8px 10px;font-size:11px}
    .bhint{display:none}
    .pillar .p-label{display:none}
    .legend-panel{font-size:11px;padding:7px 10px}
}
@media (prefers-reduced-motion:reduce){
    .hl,.flame.lit,#shell.th-danger .content::after{animation:none}
    .lb{animation:none}
}
</style>
</head>
<body>

<div class="map-shell" id="shell">
    <!-- 标题带：标题 + 巨神柱残焰 -->
    <div class="head-band">
        <span class="map-title">阿瓦隆全图</span>
        <span class="spring"></span>
        <span class="pillar" id="pillar" style="display:none" title="巨神柱残焰：柱子燃尽之日，阿瓦隆陷落之时">
            <span class="p-label">巨神柱残焰</span>
            <span class="flame"></span><span class="flame"></span><span class="flame"></span><span class="flame"></span>
            <span class="flame"></span><span class="flame"></span><span class="flame"></span><span class="flame"></span>
            <span class="p-days" id="pillarDays"></span>
        </span>
    </div>

    <!-- 控制带：当前位置 + 模式/视图/缩放（汉字磨砂按钮） -->
    <div class="ctrl-band">
        <span class="loc-info" id="locInfo">—</span>
        <span class="grp">
            <button class="btn" id="bA">鸟瞰</button>
            <button class="btn on" id="bS">街景</button>
            <button class="btn" id="bM">地图</button>
        </span>
        <span class="grp">
            <button class="btn" id="bZo" title="缩小">缩小</button>
            <button class="btn" id="bZi" title="放大">放大</button>
            <button class="btn" id="bHome" title="回到当前位置">归位</button>
        </span>
        <span class="grp">
            <button class="btn" id="bFS" title="全屏">全屏</button>
        </span>
    </div>

    <!-- 地图区 -->
    <div class="content" id="ct">
        <div class="big-view" id="bv">
            <div class="stage" id="stage"></div>
        </div>
        <!-- 街景模式：当前地点大图 / 图瓦坦五牌并列 -->
        <div class="street-view" id="sv">
            <div class="tuv-row" id="svRow"></div>
            <img id="svImg" src="" alt="">
            <span class="sv-cap" id="svCap"></span>
        </div>

        <!-- 悬浮图例面板（可拖动） -->
        <div class="legend-panel" id="lgPanel">
            <div class="lg-row"><span class="lg-cur"></span>当前位置</div>
            <div class="lg-row"><span class="lg-exp"></span>已探索</div>
            <div class="lg-row"><span class="lg-un"></span>未探索</div>
            <div class="lg-sep"></div>
            <div class="lg-row lg-stat" id="expStat">已探索 —</div>
            <div class="lg-grip">⋮⋮</div>
        </div>
    </div>

    <!-- 底栏：操作提示 -->
    <div class="bottom-bar">
        <span class="bhint">拖拽平移 · 滚轮/双指缩放 · 点击已探索格查看原图</span>
    </div>
</div>

<!-- 原图灯箱 -->
<div class="lb" id="lb">
    <span class="lb-hint">滚轮缩放 · 拖拽移动 · 双击复位 · ESC 关闭</span>
    <span class="lb-x" id="lbX">✕</span>
    <div class="lb-stage" id="lbStage">
        <img id="lbImg" src="" alt="">
    </div>
    <span class="lb-cap" id="lbCap"></span>
</div>

<script>
(function(){
'use strict';

/* ══════════════════════════════════════════════
   图床配置：file:// 本地演示 / http(s) 酒馆 CDN
   全岛原图 138MB 仅限本地；CDN 移植时再定压缩策略
   ══════════════════════════════════════════════ */
var IS_LOCAL = location.protocol === 'file:';
var LOCAL_ROOT = 'file:///C:/迅雷下载/污痕圣杯 阿瓦隆的陨落 基础中文修复版 Tainted Grail Fall of Avalon/Mods/Images/地点卡插图';
// GitHub Pages 自动返回正确 MIME type，raw/testingcf 都出 text/plain
var CDN_ROOT = 'https://jalaka12.github.io/avalon-map/images';
var PH = (IS_LOCAL ? LOCAL_ROOT + '/cropped' : CDN_ROOT + '/locations');
var SKETCH = (IS_LOCAL ? LOCAL_ROOT + '/cropped' : CDN_ROOT) + '/6x6手绘地图.png'; // 手绘原图（低清源文件，永不压缩）
var PAGE_BG = (IS_LOCAL ? LOCAL_ROOT + '/底图' : CDN_ROOT) + '/底图.jpg';   // 页面装饰底图（压缩版，暗遮罩下无损感）
var BASE_AERIAL = (IS_LOCAL ? LOCAL_ROOT + '/cropped' : CDN_ROOT) + '/map-aerial.jpg'; // 鸟瞰底图（压缩拼接小图，省资源）
var CARD_AR = 922/1365;      // 单卡宽高比

/* ── 8×10 系统坐标 ── */
var C = {"101":{"row":5,"col":5,"rowName":"中轴","colName":"中轴"},"102":{"row":4,"col":5,"rowName":"北1","colName":"中轴"},"103":{"row":5,"col":4,"rowName":"中轴","colName":"西1"},"104":{"row":5,"col":6,"rowName":"中轴","colName":"东1"},"105":{"row":6,"col":5,"rowName":"南1","colName":"中轴"},"106":{"row":4,"col":4,"rowName":"北1","colName":"西1"},"107":{"row":4,"col":6,"rowName":"北1","colName":"东1"},"108":{"row":6,"col":4,"rowName":"南1","colName":"西1"},"109":{"row":6,"col":6,"rowName":"南1","colName":"东1"},"111":{"row":3,"col":3,"rowName":"北2","colName":"西2"},"112":{"row":3,"col":4,"rowName":"北2","colName":"西1"},"113":{"row":3,"col":5,"rowName":"北2","colName":"中轴"},"114":{"row":3,"col":6,"rowName":"北2","colName":"东1"},"115":{"row":3,"col":7,"rowName":"北2","colName":"东2"},"116":{"row":4,"col":3,"rowName":"北1","colName":"西2"},"117":{"row":4,"col":7,"rowName":"北1","colName":"东2"},"118":{"row":5,"col":3,"rowName":"中轴","colName":"西2"},"119":{"row":5,"col":7,"rowName":"中轴","colName":"东2"},"120":{"row":6,"col":3,"rowName":"南1","colName":"西2"},"131":{"row":2,"col":3,"rowName":"北3","colName":"西2"},"132":{"row":2,"col":4,"rowName":"北3","colName":"西1"},"133":{"row":2,"col":5,"rowName":"北3","colName":"中轴"},"134":{"row":2,"col":6,"rowName":"北3","colName":"东1"},"135":{"row":2,"col":7,"rowName":"北3","colName":"东2"},"136":{"row":2,"col":8,"rowName":"北3","colName":"东3"},"138":{"row":3,"col":8,"rowName":"北2","colName":"东3"},"139":{"row":4,"col":2,"rowName":"北1","colName":"西3"},"140":{"row":4,"col":8,"rowName":"北1","colName":"东3"},"141":{"row":5,"col":2,"rowName":"中轴","colName":"西3"},"150":{"row":1,"col":3,"rowName":"北4","colName":"西2"},"151":{"row":1,"col":4,"rowName":"北4","colName":"西1"},"152":{"row":1,"col":5,"rowName":"北4","colName":"中轴"},"153":{"row":1,"col":6,"rowName":"北4","colName":"东1"},"154":{"row":1,"col":7,"rowName":"北4","colName":"东2"},"155":{"row":1,"col":8,"rowName":"北4","colName":"东3"},"156":{"row":4,"col":1,"rowName":"北1","colName":"西4"},"157":{"row":4,"col":9,"rowName":"北1","colName":"东4"},"160":{"row":0,"col":5,"rowName":"北5","colName":"中轴"},"161":{"row":0,"col":7,"rowName":"北5","colName":"东2"},"162":{"row":7,"col":9,"rowName":"南2","colName":"东4"},"180":{"row":1,"col":2,"rowName":"北4","colName":"西3"},"185":{"row":3,"col":1,"rowName":"北2","colName":"西4"},"190":{"row":3,"col":9,"rowName":"北2","colName":"东4"},"199":{"row":2,"col":2,"rowName":"北3","colName":"西3"}};
var NAMES = {"101":"昆纳赫特村","102":"猎人森林","103":"武者集会","104":"礼堂废墟","105":"荒剑冢","106":"先民坟山","107":"白化村","108":"蛆林","109":"避难岛","110":"闹鬼的蛆林","111":"高墙之下","112":"染血峡谷","113":"镜湖","114":"盘根树林","115":"巨人阶梯","116":"远郡","117":"第一村","118":"奔涌平原","119":"舰队残骸","120":"南之角","121":"残败的昆纳赫特","122":"干涩的湖泊","123":"沉没的坟山","125":"巨人阶梯(寺庙被毁)","126":"倒塌的巨石","131":"木墙城","132":"宁静之脸","133":"月环阵","134":"法福瑞","135":"邦多卡","136":"库瓦赫石塔","137":"被征服的木墙城","138":"瘟疫街区","139":"大灾变","140":"黑暗沼泽","141":"冥尘边界","142":"安静的街区","147":"被遗弃的法福瑞","148":"法多卡","149":"残破的石塔","150":"守卫之谷","151":"高丘","152":"半路村","153":"蕨海","154":"骑士团之墓","155":"低语森林","156":"大瀑布","157":"闪烁平原","158":"谈判会场","160":"鸦巢城","161":"远望角","162":"戈比尼克","165":"鸦巢废墟","170":"远望角避难所","180":"欧林的哨站","185":"图瓦坦之心","190":"卡梅洛","195":"被包围的卡梅洛","199":"图瓦坦"};
var TOTAL = 0; for (var k in C) TOTAL++;
/* 系统坐标 → 地点反查表 */
var AT = {}; for (var id2 in C) AT[C[id2].row + ',' + C[id2].col] = id2;

/* ── 替换地点表（游戏数据：主线地点被剧情替换后共用格子） ──
   替换版 → 原版；显示规则：探索记录含替换版则显示替换版，否则原版 */
var REPLACE = {"121":"101","123":"106","110":"108","122":"113","125":"115","126":"116","137":"131","147":"134","148":"135","149":"136","142":"138","158":"152","165":"160","170":"161","195":"190"};
var BASE2REP = {}; for (var rk in REPLACE) BASE2REP[REPLACE[rk]] = rk;
/* 地点 → 所在格子坐标（替换版继承原版格子） */
function cellOf(id){ return C[id] || C[REPLACE[id]] || null; }
/* 地点 → 原版编号（替换版映射回原版，非替换地点返回自身） */
function baseOf(id){ return REPLACE[id] || id; }
/* 格子是否已探索：原版或替换版任一在探索记录中 */
function cellExplored(baseId, exp){ return !!exp[baseId] || !!(BASE2REP[baseId] && exp[BASE2REP[baseId]]); }
/* 格子的当前显示版本：替换版已探索 → 替换版；否则原版 */
function dispId(baseId, exp){ var rep = BASE2REP[baseId];
    if(rep && exp[rep]) return rep; return baseId; }
/* 图瓦坦：共用卡背(正) / 每牌独立街景(反)；batch 恒为 7 */
function tuvPhoto(card, m){ return PH + '/' + (m==='street'?'反':'正') + '7_199-' + card + '.png'; }
function tuvCard(p){ return p.tuathan.length ? p.tuathan[p.tuathan.length-1] : 1; } // 当前牌=最后揭示

/* 手绘地图覆盖：行 1~6（北4~南1）、列 3~8（西2~东3） */
function inSketch(r, c){ return r>=1 && r<=6 && c>=3 && c<=8; }
/* 以当前地点为中心的 3×3 范围（鸟瞰模式高清视窗） */
function inNine(r, c, ct){ return r>=ct.row-1 && r<=ct.row+1 && c>=ct.col-1 && c<=ct.col+1; }

var GW = 1800, GH = 2136;

/* ── 状态 ── */
var mode = 'street';   // aerial 鸟瞰(正) | street 街景(反) | map 地图(手绘)
var fs = false;
var tf = {x:0, y:0, s:1};
var MIN_S = 0.35, MAX_S = 5;

/* ── 本地偏好（模式/视图 + 图例面板位置） ── */
var STORE_KEY = 'jll.map.ui';
function saveUI(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify({mode:mode})); }catch(e){} }
function loadUI(){ try{ var r = localStorage.getItem(STORE_KEY); if(!r) return; var o = JSON.parse(r);
    if(o.mode==='aerial'||o.mode==='street'||o.mode==='map') mode = o.mode; }catch(e){} }
var LG_KEY = 'jll.map.legend';
function saveLG(x, y){ try{ localStorage.setItem(LG_KEY, JSON.stringify({x:x, y:y})); }catch(e){} }
function loadLG(){ try{ var r = localStorage.getItem(LG_KEY); if(!r) return null; var o = JSON.parse(r);
    if(typeof o.x==='number' && typeof o.y==='number') return o; }catch(e){} return null; }

/* ── 图片寻址 ── */
function batch(n){ // 与 cropped/ 实际文件一致：每批约 9-10 张，按编号排序
    n = parseInt(n,10);
    if(n<=109) return '1';
    if(n<=118) return '2';
    if(n<=126 || n<=132) return '3';   // 119-126, 131, 132
    if(n<=141) return '4';             // 133-141
    if(n<=154) return '5';             // 142, 147-154
    if(n<=170) return '6';             // 155-158, 160-162, 165, 170
    return '7';                        // 180, 185, 190, 195, 199
}
function photo(id, m){ return PH + '/' + (m==='street'?'反':'正') + batch(id) + '_' + id + '.png'; }
function lbPhoto(id){ // 灯箱跟随模式；图瓦坦用当前牌对应卡面
    if(id === '199') return tuvPhoto(tuvCard(prs()), mode==='street' ? 'street' : 'aerial');
    return photo(id, mode==='street' ? 'street' : 'aerial'); }

/* ── URL 参数（白名单过滤；loc/explored 接受原版与替换版编号） ── */
function prs(){
    var loc = '101', ex = [], pillar = null, tuathan = [];
    try{
        var p = new URLSearchParams(window.location.search);
        var l = p.get('loc'); if(l && cellOf(l)) loc = l;
        var e = p.get('explored');
        if(e) ex = e.split(',').filter(function(id){ return /^\d{3}$/.test(id) && cellOf(id); });
        var pl = parseInt(p.get('pillar'),10);
        if(!isNaN(pl) && pl>=0 && pl<=99) pillar = pl;
        var t = p.get('tuathan');   // 图瓦坦已揭示牌，如 tuathan=1,3
        if(t) tuathan = t.split(',').filter(function(n){ return /^[1-5]$/.test(n); }).map(Number);
    }catch(e){}
    return {loc:loc, explored:ex, pillar:pillar, tuathan:tuathan};
}
function expMap(p){ var m = {}; p.explored.forEach(function(id){ m[id]=true; }); m[p.loc]=true; return m; }
/* 带图片回退的 img：替换版照片缺失时回退原版，再缺则移除 */
function mkPhoto(id, mode, cls){ var img = mkImg(photo(id, mode), cls);
    var base = REPLACE[id];
    if(base){ img.onerror = function(){ this.onerror = function(){ this.remove(); }; this.src = photo(base, mode); }; }
    return img; }
/* 图瓦坦格子的牌组指示：5 个牌位，已揭示点亮 */
function deckWidget(revealed){
    var d = document.createElement('div'); d.className = 'tuv-deck';
    for(var i=1; i<=5; i++){
        var s = document.createElement('span');
        s.className = 'tuv-card' + (revealed.indexOf(i) >= 0 ? ' on' : '');
        s.textContent = i;
        d.appendChild(s);
    }
    return d;
}

/* ── 工具 ── */
function $(id){ return document.getElementById(id); }
function mkImg(src, cls){ var img = document.createElement('img');
    img.src = src; img.loading = 'lazy'; img.draggable = false;
    if(cls) img.className = cls;
    img.onerror = function(){ this.remove(); };
    return img; }

/* ── 变换 ── */
function atf(){ $('stage').style.transform = 'translate(' + tf.x + 'px,' + tf.y + 'px) scale(' + tf.s + ')'; }
function clampXY(){
    var bv = $('bv'), vw = bv.clientWidth, vh = bv.clientHeight;
    var w = GW*tf.s, h = GH*tf.s;
    if (tf.x > vw*0.85) tf.x = vw*0.85;
    if (tf.x + w < vw*0.15) tf.x = vw*0.15 - w;
    if (tf.y > vh*0.85) tf.y = vh*0.85;
    if (tf.y + h < vh*0.15) tf.y = vh*0.15 - h;
}
function zoomAt(cx, cy, factor){
    var ns = Math.max(MIN_S, Math.min(MAX_S, tf.s*factor));
    if (ns === tf.s) return;
    var mx = (cx - tf.x)/tf.s, my = (cy - tf.y)/tf.s;
    tf.s = ns; tf.x = cx - mx*ns; tf.y = cy - my*ns;
    clampXY(); atf();
}
function centerOn(id, scale){
    var ct = cellOf(id); if(!ct) return;
    var bv = $('bv'), vw = bv.clientWidth, vh = bv.clientHeight;
    if(vw<=0||vh<=0){ setTimeout(function(){ centerOn(id, scale); }, 60); return; }
    tf.s = scale || 1;
    tf.x = vw/2 - (ct.col+0.5)*(GW/10)*tf.s;
    tf.y = vh/2 - (ct.row+0.5)*(GH/8)*tf.s;
    atf();
}

/* ══════════════ 8×10 全图 ══════════════
   鸟瞰：压缩拼接小图垫底 + 3×3 高清视窗（原始大图）+ 磨砂遮蔽
   地图：手绘原图垫底（不压缩）+ 苔痕/半遮蔽
   替换地点：探索记录含替换版则显示替换版（照片缺失回退原版）
   图瓦坦：199 格带牌组指示，共用卡背/独立街景
══════════════════════════════ */
function buildBig(){
    var stage = $('stage'); stage.innerHTML = '';
    var p = prs(), exp = expMap(p), curCt = cellOf(p.loc);

    if(mode === 'aerial'){
        // 先铺手绘小图作为占位底，大图加载完成后自然覆盖
        stage.appendChild(mkImg(SKETCH, 'base base-sketch'));
        stage.appendChild(mkImg(BASE_AERIAL, 'base base-aerial'));
        var cells = document.createElement('div'); cells.className = 'cells';
        for(var r=0; r<8; r++) for(var c=0; c<10; c++){
            var cell = document.createElement('div'); cell.className = 'cell';
            var lid = AT[r + ',' + c];
            var isCur = !!(curCt && curCt.row===r && curCt.col===c);
            // 3×3 视窗内且已探索 → 原始大图；其余磨砂
            var hiRes = lid && curCt && inNine(r, c, curCt) && (cellExplored(lid, exp) || isCur);
            if(hiRes){
                var showId = isCur ? p.loc : dispId(lid, exp);
                cell.classList.add('explored');
                cell.appendChild(lid==='199' ? mkImg(tuvPhoto(tuvCard(p), 'aerial'), 'ph')
                                             : mkPhoto(showId, 'aerial', 'ph'));
                (function(l){ cell.addEventListener('click', function(){ if(!dragMoved) showFull(l); }); })(showId);
            }else{
                var f = document.createElement('div'); f.className = 'frost';
                cell.appendChild(f);
            }
            if(lid === '199') cell.appendChild(deckWidget(p.tuathan));
            if(isCur){
                var hl = document.createElement('div'); hl.className = 'hl';
                var dot = document.createElement('div'); dot.className = 'dot';
                hl.appendChild(dot); cell.appendChild(hl);
            }
            cells.appendChild(cell);
        }
        stage.appendChild(cells);
    }else{
        // 地图：核心区内无地点格（右下角三格等）恒为暗色
        stage.appendChild(mkImg(SKETCH, 'base base-sketch'));
        var cells2 = document.createElement('div'); cells2.className = 'cells';
        for(var r2=0; r2<8; r2++) for(var c2=0; c2<10; c2++){
            var cell2 = document.createElement('div'); cell2.className = 'cell';
            var lid2 = AT[r2 + ',' + c2];
            if(lid2){
                var isCur2 = !!(curCt && curCt.row===r2 && curCt.col===c2);
                var shown2 = cellExplored(lid2, exp) || isCur2;
                var mk2 = document.createElement('div');
                mk2.className = shown2 ? 'moss-mark' : 'veil';
                cell2.appendChild(mk2);
                if(shown2){
                    cell2.classList.add('explored');
                    var sid = isCur2 ? p.loc : dispId(lid2, exp);
                    (function(l){ cell2.addEventListener('click', function(){ if(!dragMoved) showFull(l); }); })(sid);
                }
                if(lid2 === '199') cell2.appendChild(deckWidget(p.tuathan));
                if(isCur2){
                    var hl2 = document.createElement('div'); hl2.className = 'hl';
                    var dot2 = document.createElement('div'); dot2.className = 'dot';
                    hl2.appendChild(dot2); cell2.appendChild(hl2);
                }
            }else if(inSketch(r2, c2)){
                var dk = document.createElement('div'); dk.className = 'veil';
                cell2.appendChild(dk);
            }
            cells2.appendChild(cell2);
        }
        stage.appendChild(cells2);
    }

    centerOn(p.loc, fs ? 1.3 : 1);
    updateInfo(p); updateStat(p);
}

/* 街景：普通地点显示当前街景大图；图瓦坦并列五牌（已解锁去磨砂） */
function buildStreet(){
    var p = prs(), ct = cellOf(p.loc);
    var img = $('svImg'), row = $('svRow');
    if(p.loc === '199'){
        img.style.display = 'none';
        row.style.display = 'flex';
        buildTuvRow(p);
        var extra = [];
        if(expMap(p)['180']) extra.push('哨站');
        if(expMap(p)['185']) extra.push('之心');
        $('svCap').innerHTML = '<b>图瓦坦</b> · 已揭示 ' + p.tuathan.length + '/5' + (extra.length ? ' · 常驻：' + extra.join('、') : '');
    }else{
        row.style.display = 'none';
        img.style.display = '';
        img.onerror = function(){ var b = REPLACE[p.loc];
            if(b){ img.onerror = null; img.src = photo(b, 'street'); } };
        img.src = photo(p.loc, 'street');
        $('svCap').innerHTML = '当前所在 · <b>' + (NAMES[p.loc]||p.loc) + '</b>' + (ct ? ' · ' + ct.rowName + '·' + ct.colName : '');
    }
    updateInfo(p); updateStat(p);
}
/* 图瓦坦五牌并列：揭示牌亮出独立街景，未揭示磨砂；180/185 常驻牌追加 */
function buildTuvRow(p){
    var row = $('svRow'); row.innerHTML = '';
    var cur = tuvCard(p), exp = expMap(p);
    for(var i=1; i<=5; i++){
        var rev = p.tuathan.indexOf(i) >= 0;
        var card = document.createElement('div');
        card.className = 'tuv-slot' + (rev ? ' rev' : '') + (rev && i===cur ? ' cur' : '');
        card.appendChild(mkImg(tuvPhoto(i, 'street')));
        if(!rev){ var fr = document.createElement('div'); fr.className = 'frost'; card.appendChild(fr); }
        else{
            var tag = document.createElement('span'); tag.className = 'slot-tag'; tag.textContent = '图瓦坦-' + i;
            card.appendChild(tag);
            (function(n){ card.addEventListener('click', function(e){ e.stopPropagation(); showTuv(n); }); })(i);
        }
        row.appendChild(card);
    }
    // 常驻特殊牌：180 欧林的哨站 / 185 图瓦坦之心（已揭示才入列，规则：不收走）
    [['180','欧林哨站'],['185','图瓦坦之心']].forEach(function(cfg){
        var sid = cfg[0];
        if(!exp[sid]) return;
        var card = document.createElement('div');
        card.className = 'tuv-slot rev' + (p.loc===sid ? ' cur' : '');
        card.appendChild(mkPhoto(sid, 'street'));
        var tag = document.createElement('span'); tag.className = 'slot-tag'; tag.textContent = cfg[1];
        card.appendChild(tag);
        card.addEventListener('click', function(e){ e.stopPropagation(); showFull(sid); });
        row.appendChild(card);
    });
}
/* 灯箱看图瓦坦某张已揭示牌的街景 */
function showTuv(n){
    $('lbImg').src = tuvPhoto(n, 'street');
    $('lbCap').innerHTML = '<b>图瓦坦-' + n + '</b> · 199 · 街景';
    lbFit(CARD_AR);
    $('lb').classList.add('on');
    lbReset();
}

/* ── 信息区与主题 ── */
function updateInfo(p){
    var ct = cellOf(p.loc);
    $('locInfo').innerHTML = ct
        ? '<b>' + (NAMES[p.loc]||p.loc) + '</b>' + ct.rowName + ' · ' + ct.colName
        : '<b>' + (NAMES[p.loc]||p.loc) + '</b>';
    var pw = $('pillar'), shell = $('shell');
    shell.classList.remove('th-warn','th-danger');
    // 图瓦坦区域内无巨神柱（199/180/185 均属图瓦坦深处）
    if(p.pillar === null || p.loc==='199' || p.loc==='180' || p.loc==='185'){ pw.style.display = 'none'; return; }
    pw.style.display = '';
    if(p.pillar <= 2) shell.classList.add('th-danger');
    else if(p.pillar <= 4) shell.classList.add('th-warn');
    var lit = Math.max(0, Math.min(8, p.pillar));
    var flames = pw.querySelectorAll('.flame');
    for(var i=0; i<flames.length; i++) flames[i].classList.toggle('lit', i < lit);
    $('pillarDays').textContent = p.pillar + '天';
}
function updateStat(p){
    // 按格子计数：原版与替换版归为同一格
    var cells = {};
    p.explored.forEach(function(id){ var b = baseOf(id); if(C[b]) cells[b] = 1; });
    var lb = baseOf(p.loc); if(C[lb]) cells[lb] = 1;
    var n = Object.keys(cells).length;
    $('expStat').textContent = '已探索 ' + Math.min(n, TOTAL) + '/' + TOTAL;
}

/* ── 渲染调度 ── */
function ren(){
    var street = (mode === 'street');
    $('bv').style.display = street ? 'none' : '';
    $('sv').style.display = street ? 'flex' : 'none';
    $('bZo').disabled = $('bZi').disabled = $('bHome').disabled = street;
    if(street) buildStreet(); else buildBig();
}
function setMode(m){ mode = m;
    $('bA').classList.toggle('on', m==='aerial');
    $('bS').classList.toggle('on', m==='street');
    $('bM').classList.toggle('on', m==='map');
    saveUI(); ren(); }

/* ── 灯箱（原图 + 缩放拖拽；全岛带迷雾磨砂遮罩） ── */
var lbTf = {x:0, y:0, s:1};
function lbApply(){ $('lbStage').style.transform = 'translate(' + lbTf.x + 'px,' + lbTf.y + 'px) scale(' + lbTf.s + ')'; }
function lbReset(){ lbTf = {x:0, y:0, s:1}; lbApply(); }
function lbFit(ar){ // 按图片宽高比计算舞台尺寸
    var maxW = window.innerWidth*0.94, maxH = window.innerHeight*0.86;
    var w = maxW, h = w/ar;
    if(h > maxH){ h = maxH; w = h*ar; }
    var st = $('lbStage');
    st.style.width = w + 'px'; st.style.height = h + 'px';
}
function showFull(id){
    $('lbImg').src = lbPhoto(id);
    var ct = C[id];
    $('lbCap').innerHTML = '<b>' + (NAMES[id]||id) + '</b> · ' + id + (ct ? ' · ' + ct.rowName + '·' + ct.colName : '');
    lbFit(CARD_AR);
    $('lb').classList.add('on');
    lbReset();
}
function closeLb(){ $('lb').classList.remove('on'); }
function bindLightbox(){
    var lb = $('lb'), st = $('lbStage');
    var dragging = false, sx = 0, sy = 0, ox = 0, oy = 0, moved = false;
    st.addEventListener('pointerdown', function(e){
        dragging = true; moved = false; sx = e.clientX; sy = e.clientY; ox = lbTf.x; oy = lbTf.y;
        lb.classList.add('dragging'); e.preventDefault(); e.stopPropagation();
    });
    window.addEventListener('pointermove', function(e){
        if(!dragging) return;
        var dx = e.clientX - sx, dy = e.clientY - sy;
        if(Math.abs(dx)>4 || Math.abs(dy)>4) moved = true;
        lbTf.x = ox + dx; lbTf.y = oy + dy;
        lbApply();
    });
    window.addEventListener('pointerup', function(){ dragging = false; lb.classList.remove('dragging'); });
    lb.addEventListener('wheel', function(e){
        e.preventDefault();
        var rect = st.getBoundingClientRect();
        var cx = e.clientX - rect.left, cy = e.clientY - rect.top;
        var ns = Math.max(0.5, Math.min(6, lbTf.s * (e.deltaY > 0 ? 0.85 : 1.18)));
        var rx = cx / lbTf.s, ry = cy / lbTf.s;
        lbTf.x -= rx * (ns - lbTf.s); lbTf.y -= ry * (ns - lbTf.s);
        lbTf.s = ns; lbApply();
    }, {passive:false});
    st.addEventListener('dblclick', function(e){ lbReset(); e.stopPropagation(); });
    $('lbX').addEventListener('click', closeLb);
    lb.addEventListener('click', function(e){ if(e.target === this) closeLb(); });
}

/* ── 悬浮图例面板拖动 ── */
function bindLegend(){
    var panel = $('lgPanel'), ct = $('ct');
    var saved = loadLG();
    if(saved){ panel.style.left = saved.x + 'px'; panel.style.top = saved.y + 'px'; panel.style.bottom = 'auto'; }
    var dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
    panel.addEventListener('pointerdown', function(e){
        dragging = true; sx = e.clientX; sy = e.clientY;
        ox = panel.offsetLeft; oy = panel.offsetTop;
        panel.style.bottom = 'auto';
        panel.classList.add('dragging');
        e.preventDefault(); e.stopPropagation();
    });
    window.addEventListener('pointermove', function(e){
        if(!dragging) return;
        var nx = ox + (e.clientX - sx), ny = oy + (e.clientY - sy);
        // 限制在地图区内
        nx = Math.max(0, Math.min(ct.clientWidth - panel.offsetWidth, nx));
        ny = Math.max(0, Math.min(ct.clientHeight - panel.offsetHeight, ny));
        panel.style.left = nx + 'px'; panel.style.top = ny + 'px';
    });
    window.addEventListener('pointerup', function(){
        if(!dragging) return;
        dragging = false; panel.classList.remove('dragging');
        saveLG(panel.offsetLeft, panel.offsetTop);
    });
}

/* ── 地图拖拽 / 捏合（不用 setPointerCapture，防 click 被重定向） ── */
var dragMoved = false;
var pts = {};
var dragBase = null, pinchBase = null;

function ptDist(){ var ks = Object.keys(pts); if(ks.length<2) return 0;
    var a = pts[ks[0]], b = pts[ks[1]];
    return Math.sqrt((a.x-b.x)*(a.x-b.x) + (a.y-b.y)*(a.y-b.y)); }
function ptMid(bv){ var ks = Object.keys(pts); var x=0, y=0;
    ks.forEach(function(k){ x += pts[k].x; y += pts[k].y; });
    var rect = bv.getBoundingClientRect();
    return { x: x/ks.length - rect.left, y: y/ks.length - rect.top }; }

function bindPan(){
    var bv = $('bv');
    bv.addEventListener('pointerdown', function(e){
        pts[e.pointerId] = {x:e.clientX, y:e.clientY};
        dragMoved = false;
        if(Object.keys(pts).length === 1){
            dragBase = {x:e.clientX, y:e.clientY, ox:tf.x, oy:tf.y};
            pinchBase = null;
            bv.classList.add('drag');
        }else if(Object.keys(pts).length === 2){
            dragBase = null;
            var mid = ptMid(bv);
            pinchBase = { dist: ptDist(), s: tf.s,
                mx: (mid.x - tf.x)/tf.s, my: (mid.y - tf.y)/tf.s };
        }
        e.preventDefault();
    });
    window.addEventListener('pointermove', function(e){
        if(!(e.pointerId in pts)) return;
        pts[e.pointerId] = {x:e.clientX, y:e.clientY};
        var n = Object.keys(pts).length;
        if(n === 1 && dragBase){
            var dx = e.clientX - dragBase.x, dy = e.clientY - dragBase.y;
            if(Math.abs(dx)>4 || Math.abs(dy)>4) dragMoved = true;
            tf.x = dragBase.ox + dx; tf.y = dragBase.oy + dy;
            clampXY(); atf();
        }else if(n === 2 && pinchBase){
            dragMoved = true;
            var d = ptDist(); if(d <= 0 || pinchBase.dist <= 0) return;
            var mid = ptMid(bv);
            var ns = Math.max(MIN_S, Math.min(MAX_S, pinchBase.s * d / pinchBase.dist));
            tf.s = ns; tf.x = mid.x - pinchBase.mx*ns; tf.y = mid.y - pinchBase.my*ns;
            clampXY(); atf();
        }
    });
    function up(e){
        if(!(e.pointerId in pts)) return;
        delete pts[e.pointerId];
        if(Object.keys(pts).length < 2) pinchBase = null;
        if(Object.keys(pts).length === 0){ dragBase = null; $('bv').classList.remove('drag'); }
        else if(Object.keys(pts).length === 1){
            var k = Object.keys(pts)[0];
            dragBase = {x:pts[k].x, y:pts[k].y, ox:tf.x, oy:tf.y};
        }
        setTimeout(function(){ dragMoved = false; }, 0);
    }
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
    $('bv').addEventListener('wheel', function(e){
        e.preventDefault();
        var rect = $('bv').getBoundingClientRect();
        zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY > 0 ? 0.86 : 1.16);
    }, {passive:false});
}

/* ── 控件绑定 ── */
function bindUI(){
    $('bA').addEventListener('click', function(){ setMode('aerial'); });
    $('bS').addEventListener('click', function(){ setMode('street'); });
    $('bM').addEventListener('click', function(){ setMode('map'); });
    $('bZo').addEventListener('click', function(){ var bv = $('bv'); zoomAt(bv.clientWidth/2, bv.clientHeight/2, 0.8); });
    $('bZi').addEventListener('click', function(){ var bv = $('bv'); zoomAt(bv.clientWidth/2, bv.clientHeight/2, 1.25); });
    $('bHome').addEventListener('click', function(){ centerOn(prs().loc, 1); });
    $('sv').addEventListener('click', function(){ showFull(prs().loc); });
    $('bFS').addEventListener('click', function(){
        fs = !fs;
        $('shell').classList.toggle('fs', fs);
        this.textContent = fs ? '退出' : '全屏';
        setTimeout(function(){ if(mode!=='street') centerOn(prs().loc, fs ? 1.3 : 1); }, 60);
    });
    document.addEventListener('keydown', function(e){
        if(e.key !== 'Escape') return;
        if($('lb').classList.contains('on')){ closeLb(); return; }
        if(fs) $('bFS').click();
    });
    window.addEventListener('resize', function(){
        if(mode !== 'street') centerOn(prs().loc, tf.s);
    });
}
