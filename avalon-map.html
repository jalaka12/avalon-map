<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>阿瓦隆地图 · 加洛琳</title>
<style>
:root {
    --bg-map: #0d0a08;
    --bg-panel: #1a1512;
    --border: #3d332a;
    --text-dim: #8a7d6d;
    --text-main: #c4b5a0;
    --text-bright: #e8dcc8;
    --accent-gold: #b8860b;
    --accent-blood: #8b2635;
    --accent-rust: #a0522d;
    --accent-current: #daa520;
    --accent-revealed: #4a6741;
    --accent-unrevealed: #3d332a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
    background:var(--bg-map);
    color:var(--text-main);
    font-family:'Palatino Linotype',Georgia,serif;
    font-size:13px;
    overflow:hidden;
    width:100vw;height:100vh;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
}

#map-container{position:relative;width:100%;height:100%;overflow:hidden;cursor:grab}
#map-container.dragging{cursor:grabbing}
#map-canvas{position:absolute;transform-origin:0 0}
#map-canvas.smooth{transition:transform .3s ease-out}

.map-bg{
    position:absolute;top:0;left:0;
    width:2400px;height:1800px;
    background:radial-gradient(ellipse at 50% 50%,#1a1512 0%,#0d0a08 70%),
        repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(61,51,42,.05) 40px,rgba(61,51,42,.05) 41px);
    pointer-events:none;
}

.map-connections{position:absolute;top:0;left:0;width:2400px;height:1800px;pointer-events:none}
.connection-line{stroke:rgba(61,51,42,.5);stroke-width:1.5;stroke-dasharray:6 4;fill:none}
.connection-line.revealed{stroke:rgba(74,103,65,.4);stroke-dasharray:none}
.connection-line.current{stroke:rgba(218,165,32,.6);stroke-width:2;stroke-dasharray:none;animation:pulse-line 2s infinite}
@keyframes pulse-line{0%,100%{opacity:.4}50%{opacity:1}}

/* 地点卡片 */
.location-card{
    position:absolute;width:200px;height:150px;
    transform:translate(-100px,-75px);
    cursor:pointer;perspective:800px;
}
.location-card-inner{
    position:relative;width:100%;height:100%;
    transition:transform .5s ease;transform-style:preserve-3d;
}
.location-card.flipped .location-card-inner{transform:rotateY(180deg)}

.card-front,.card-back{
    position:absolute;inset:0;backface-visibility:hidden;
    border-radius:4px;overflow:hidden;
}
.card-front{
    background:linear-gradient(180deg,#1e1a14,#15120d);
    border:2px solid var(--accent-unrevealed);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
}
.card-front.revealed{border-color:var(--accent-revealed);background:linear-gradient(180deg,#1e241a,#151810)}
.card-front.current{border-color:var(--accent-current);background:linear-gradient(180deg,#241e14,#1a150d);box-shadow:0 0 20px rgba(218,165,32,.3)}
.card-back{
    background:linear-gradient(180deg,#1a1512,#241e18);
    border:2px solid var(--accent-rust);
    transform:rotateY(180deg);
    padding:12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;
}
.card-img{
    width:120px;height:75px;border-radius:2px;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative;
}
.card-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.card-img .placeholder{font-size:32px;opacity:.5}
.card-number{font-family:Consolas,monospace;font-size:20px;font-weight:bold;color:var(--text-dim)}
.revealed .card-number{color:var(--accent-revealed)}
.current .card-number{color:var(--accent-gold)}
.card-name{font-size:10px;color:var(--text-dim);text-align:center;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.revealed .card-name{color:var(--text-main)}
.current .card-name{color:var(--text-bright)}
.card-back .back-title{font-size:13px;font-weight:600;color:var(--accent-gold);border-bottom:1px solid var(--border);padding-bottom:6px}
.card-back .back-desc{font-size:10px;color:var(--text-dim);line-height:1.5}
.card-back .back-conn{font-size:9px;color:var(--accent-rust);margin-top:4px}

.location-card.unrevealed{opacity:.4;filter:grayscale(.8) blur(1px);pointer-events:none}

.current-pulse{
    position:absolute;width:200px;height:150px;
    transform:translate(-100px,-75px);
    border-radius:8px;border:2px solid var(--accent-current);
    animation:pulse-ring 2s infinite;pointer-events:none;z-index:-1;
}
@keyframes pulse-ring{
    0%{box-shadow:0 0 0 0 rgba(218,165,32,.4)}
    70%{box-shadow:0 0 0 20px rgba(218,165,32,0)}
    100%{box-shadow:0 0 0 0 rgba(218,165,32,0)}
}

/* ═══ 顶部信息栏 ═══ */
.top-bar{
    position:fixed;top:0;left:0;right:0;
    background:linear-gradient(180deg,rgba(13,10,8,.95),rgba(13,10,8,.7));
    padding:10px 16px;display:flex;align-items:center;justify-content:space-between;
    z-index:100;border-bottom:1px solid var(--border);
}
.top-title{font-size:16px;font-weight:600;color:var(--accent-gold);letter-spacing:1px}
.top-info{font-size:11px;color:var(--text-dim)}

/* ═══ 底部工具栏 ═══ */
.bottom-bar{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    display:flex;gap:8px;z-index:100;
}
.tool-btn{
    background:rgba(26,21,18,.85);border:1px solid var(--border);
    color:var(--text-dim);padding:8px 14px;border-radius:3px;
    font-size:12px;cursor:pointer;font-family:inherit;
    transition:all .2s;backdrop-filter:blur(4px);
}
.tool-btn:hover{background:rgba(36,30,24,.85);color:var(--text-main);border-color:var(--accent-gold)}
.tool-btn.active{background:rgba(184,134,11,.15);color:var(--accent-gold);border-color:var(--accent-gold)}

/* ═══ 弹窗 ═══ */
.modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.7);
    z-index:200;display:none;align-items:center;justify-content:center;
}
.modal-overlay.active{display:flex}
.modal-box{
    background:var(--bg-panel);border:1px solid var(--border);border-radius:6px;
    max-width:500px;width:90%;max-height:75vh;overflow-y:auto;
    padding:20px;box-shadow:0 8px 40px rgba(0,0,0,.6);
}
.modal-box .m-img{width:100%;height:180px;border-radius:4px;margin-bottom:12px;overflow:hidden}
.modal-box .m-img img{width:100%;height:100%;object-fit:cover}
.modal-box .m-title{font-size:18px;color:var(--accent-gold);margin-bottom:4px}
.modal-box .m-num{font-size:11px;color:var(--text-dim);font-family:monospace;margin-bottom:12px}
.modal-box .m-desc{font-size:12px;color:var(--text-dim);line-height:1.6}
.modal-box .m-conn{font-size:11px;color:var(--accent-rust);margin-top:8px}
.modal-close{display:block;width:100%;margin-top:14px;padding:8px;background:var(--border);border:none;color:var(--text-main);border-radius:3px;cursor:pointer;font-family:inherit;font-size:13px}
.modal-close:hover{background:var(--accent-rust)}
.zoom-indicator{position:fixed;top:60px;right:16px;background:rgba(26,21,18,.85);border:1px solid var(--border);padding:4px 10px;border-radius:3px;font-size:11px;color:var(--text-dim);z-index:100;font-family:monospace}
</style>
</head>
<body>

<div class="top-bar">
    <span class="top-title">🗺 阿瓦隆</span>
    <span class="top-info" id="top-info">地点 0/63 已揭示 · 双击卡片翻面</span>
</div>
<div class="zoom-indicator" id="zoom-label">100%</div>

<div id="map-container">
    <div id="map-canvas">
        <div class="map-bg"></div>
        <svg class="map-connections" id="connections-svg"></svg>
        <div id="locations-layer"></div>
    </div>
</div>

<div class="bottom-bar">
    <button class="tool-btn" id="btn-zoom-in">🔍+</button>
    <button class="tool-btn" id="btn-zoom-out">🔍−</button>
    <button class="tool-btn" id="btn-reset">📍 重置</button>
    <button class="tool-btn" id="btn-current">🎯 当前位置</button>
    <button class="tool-btn" id="btn-reveal-all">👁 全部揭示</button>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <div class="m-img" id="modal-img"></div>
        <div class="m-title" id="modal-title"></div>
        <div class="m-num" id="modal-num"></div>
        <div class="m-desc" id="modal-desc"></div>
        <div class="m-conn" id="modal-conn"></div>
        <button class="modal-close" id="modal-close-btn">关闭</button>
    </div>
</div>

// ═══ 状态 ═══
let currentLocation = 101;
let revealedLocations = new Set([101,102,103,104,105]);
let scale = 0.65;
let panX = 50, panY = 120;
let isDragging = false, dragStartX = 0, dragStartY = 0;
const REPLACEMENTS = {101:121,106:123,108:110,113:122,115:125,116:126,131:137,134:147,135:148,136:149,138:142,160:165,161:170,190:195};

// ═══ DOM ═══
const container = document.getElementById('map-container');
const canvas = document.getElementById('map-canvas');
const connSvg = document.getElementById('connections-svg');
const locLayer = document.getElementById('locations-layer');
const topInfo = document.getElementById('top-info');
const zoomLabel = document.getElementById('zoom-label');

// ═══ 渲染 ═══
function applyTransform() {
    canvas.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')';
    zoomLabel.textContent = Math.round(scale * 100) + '%';
}

function renderConnections() {
    let svg = '';
    const drawn = new Set();
    for (const [num, loc] of Object.entries(LOCATIONS)) {
        if (!loc.conn) continue;
        for (const c of loc.conn) {
            const key = [Math.min(num, c.l), Math.max(num, c.l)].join('-');
            if (drawn.has(key)) continue;
            drawn.add(key);
            const target = LOCATIONS[c.l];
            if (!target) continue;
            const isCur = parseInt(num) === currentLocation || c.l === currentLocation;
            const isRev = revealedLocations.has(parseInt(num)) && revealedLocations.has(c.l);
            let cls = 'connection-line';
            if (isCur) cls += ' current';
            else if (isRev) cls += ' revealed';
            svg += '<line class="' + cls + '" x1="' + loc.x + '" y1="' + loc.y + '" x2="' + target.x + '" y2="' + target.y + '" />';
        }
    }
    connSvg.innerHTML = svg;
}

function renderLocations() {
    let html = '';
    const currLoc = LOCATIONS[currentLocation];
    if (currLoc && revealedLocations.has(currentLocation)) {
        html += '<div class="current-pulse" style="left:' + currLoc.x + 'px;top:' + currLoc.y + 'px"></div>';
    }
    
    for (const [num, loc] of Object.entries(LOCATIONS)) {
        const n = parseInt(num);
        const isRev = revealedLocations.has(n);
        const isCur = n === currentLocation;
        const effNum = (isRev && REPLACEMENTS[n]) ? REPLACEMENTS[n] : n;
        const effLoc = LOCATIONS[effNum] || loc;
        
        let cls = 'location-card';
        if (!isRev) cls += ' unrevealed';
        
        let fcls = 'card-front';
        if (isCur) fcls += ' current';
        else if (isRev) fcls += ' revealed';
        
        const hasImg = effLoc.front && effLoc.front.length > 5;
        const imgHtml = hasImg ? '<img src="' + effLoc.front + '" loading="lazy">' : '<span class="placeholder">' + (effLoc.name.charAt(0)) + '</span>';
        const backImgHtml = (effLoc.back && effLoc.back.length > 5) ? '<img src="' + effLoc.back + '" style="width:100%;height:100px;object-fit:cover;border-radius:2px;margin-bottom:4px">' : '';
        
        html += '<div class="' + cls + '" id="loc-' + num + '" style="left:' + loc.x + 'px;top:' + loc.y + 'px" data-num="' + num + '" onclick="onCardClick(event,' + num + ')" ondblclick="flipCard(' + num + ')">';
        html += '<div class="location-card-inner">';
        html += '<div class="' + fcls + '"><div class="card-img">' + imgHtml + '</div>';
        html += '<div class="card-number">' + num + '</div>';
        html += '<div class="card-name">' + effLoc.name + '</div></div>';
        html += '<div class="card-back">' + backImgHtml;
        html += '<div class="back-title">' + effLoc.name + ' (' + num + ')</div>';
        html += '<div class="back-desc">' + (effLoc.desc || '') + '</div>';
        html += '<div class="back-conn">' + (effLoc.conn || []).map(function(c){return c.d + '→' + c.l}).join(' · ') + '</div>';
        html += '</div></div></div>';
    }
    locLayer.innerHTML = html;
}

function updateUI() {
    topInfo.textContent = '地点 ' + revealedLocations.size + '/63 已揭示 · 双击卡片翻面';
}

function flipCard(num) {
    const card = document.getElementById('loc-' + num);
    if (card) card.classList.toggle('flipped');
}

function onCardClick(e, num) {
    if (e.detail === 2) return; // 双击翻面，不弹窗
    const loc = LOCATIONS[num];
    if (!loc || !revealedLocations.has(num)) return;
    
    const effNum = REPLACEMENTS[num] || num;
    const effLoc = LOCATIONS[effNum] || loc;
    
    const modal = document.getElementById('modal');
    const hasImg = effLoc.front && effLoc.front.length > 5;
    document.getElementById('modal-img').innerHTML = hasImg ? '<img src="' + effLoc.front + '">' : '';
    document.getElementById('modal-title').textContent = effLoc.name;
    document.getElementById('modal-num').textContent = '地点 ' + effNum + (effNum !== num ? ' (替换自 ' + num + ')' : '');
    document.getElementById('modal-desc').textContent = effLoc.desc || '';
    document.getElementById('modal-conn').textContent = '连接：' + (effLoc.conn || []).map(function(c){return c.d + '→' + c.l + ' ' + (LOCATIONS[c.l] ? LOCATIONS[c.l].name : '')}).join(' · ');
    modal.classList.add('active');
}

function closeModal() {
    document.getElementById('modal').classList.remove('active');
}

// ═══ 交互 ═══
container.addEventListener('mousedown', function(e) {
    if (e.target.closest('.location-card') || e.target.closest('.modal-overlay')) return;
    isDragging = true;
    container.classList.add('dragging');
    dragStartX = e.clientX - panX;
    dragStartY = e.clientY - panY;
});

window.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    panX = e.clientX - dragStartX;
    panY = e.clientY - dragStartY;
    applyTransform();
});

window.addEventListener('mouseup', function() {
    isDragging = false;
    container.classList.remove('dragging');
});

// 触摸支持
container.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1 && !e.target.closest('.location-card')) {
        isDragging = true;
        dragStartX = e.touches[0].clientX - panX;
        dragStartY = e.touches[0].clientY - panY;
    }
}, {passive: false});

container.addEventListener('touchmove', function(e) {
    if (!isDragging) return;
    e.preventDefault();
    panX = e.touches[0].clientX - dragStartX;
    panY = e.touches[0].clientY - dragStartY;
    applyTransform();
}, {passive: false});

container.addEventListener('touchend', function() { isDragging = false; });

// 滚轮缩放
container.addEventListener('wheel', function(e) {
    e.preventDefault();
    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const oldScale = scale;
    scale = Math.min(1.5, Math.max(0.3, scale - e.deltaY * 0.001));
    panX = mx - (mx - panX) * scale / oldScale;
    panY = my - (my - panY) * scale / oldScale;
    applyTransform();
}, {passive: false});

// 按钮
document.getElementById('btn-zoom-in').onclick = function() { scale = Math.min(1.5, scale + 0.1); applyTransform(); };
document.getElementById('btn-zoom-out').onclick = function() { scale = Math.max(0.3, scale - 0.1); applyTransform(); };
document.getElementById('btn-reset').onclick = function() { scale = 0.65; panX = 50; panY = 120; applyTransform(); };
document.getElementById('btn-current').onclick = function() {
    const loc = LOCATIONS[currentLocation];
    if (loc) {
        panX = -loc.x * scale + container.clientWidth / 2;
        panY = -loc.y * scale + container.clientHeight / 2;
        canvas.classList.add('smooth');
        applyTransform();
        setTimeout(function() { canvas.classList.remove('smooth'); }, 300);
    }
};
document.getElementById('btn-reveal-all').onclick = function() {
    Object.keys(LOCATIONS).forEach(function(n) { revealedLocations.add(parseInt(n)); });
    renderAll();
};
document.getElementById('modal-close-btn').onclick = closeModal;
document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

// 键盘
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
    if (e.key === '+' || e.key === '=') { scale = Math.min(1.5, scale + 0.1); applyTransform(); }
    if (e.key === '-') { scale = Math.max(0.3, scale - 0.1); applyTransform(); }
});

// ═══ MVU 集成 ═══
// 从 MVU 变量读取当前位置和已揭示地点
async function loadFromMVU() {
    try {
        if (typeof window.parent !== 'undefined' && window.parent.TavernHelper) {
            const vars = await window.parent.TavernHelper.getVariables({ type: 'message' });
            if (vars && vars.stat_data && vars.stat_data['加洛琳']) {
                const data = vars.stat_data['加洛琳'];
                if (data['位置与时间'] && data['位置与时间']['当前地点']) {
                    currentLocation = data['位置与时间']['当前地点'];
                }
                if (data['剧情'] && data['剧情']['状态标记']) {
                    const marks = data['剧情']['状态标记'];
                    marks.forEach(function(m) {
                        const match = String(m).match(/已探索(\d+)/);
                        if (match) revealedLocations.add(parseInt(match[1]));
                    });
                }
            }
        }
    } catch(e) {
        // MVU 不可用时使用默认值
    }
    renderAll();
}

function renderAll() {
    renderConnections();
    renderLocations();
    updateUI();
}

// 启动
loadFromMVU();
applyTransform();
</script>
